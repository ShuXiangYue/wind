<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌻 植物大战僵尸 · 终极版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1d3e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            margin: 0;
        }
        #game-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        #game-container {
            background: #5b8c3e;
            padding: 14px 18px 18px 18px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 2px #7fb35a;
            display: inline-block;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.1s ease;
            will-change: transform;
            position: relative;
        }
        #version {
            position: absolute;
            top: 8px;
            right: 20px;
            color: rgba(255, 255, 200, 0.7);
            font-size: 13px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
        }
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #4a7a30;
            padding: 4px 10px 4px 12px;
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: inset 0 -3px 0 #2d5720, 0 4px 8px rgba(0, 0, 0, 0.3);
            height: 56px;
            min-width: 700px;
            gap: 4px;
            flex-wrap: nowrap;
            position: relative;
        }
        .sun-counter,
        .energy-counter {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f5e56b;
            padding: 2px 12px 2px 8px;
            border-radius: 30px;
            box-shadow: inset 0 -3px 0 #b89e3a, 0 2px 6px rgba(0, 0, 0, 0.25);
            font-weight: bold;
            font-size: 22px;
            color: #4d3500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            height: 36px;
        }
        .energy-counter {
            background: #b0e57c;
            box-shadow: inset 0 -3px 0 #6a9a3a;
            color: #1d4a0a;
            cursor: pointer;
            transition: all 0.1s;
        }
        .energy-counter:hover {
            transform: scale(1.05);
        }
        .energy-counter.active {
            border: 2px solid #4caf50;
            box-shadow: 0 0 0 3px #8bc34a;
        }
        .sun-counter .sun-icon,
        .energy-counter .energy-icon {
            font-size: 24px;
            line-height: 1;
        }
        .cards {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            align-items: center;
        }
        .plant-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e8d6b0;
            padding: 1px 8px 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 #b89e7a, 0 4px 8px rgba(0, 0, 0, 0.25);
            transition: all 0.1s ease;
            min-width: 48px;
            border: 2px solid transparent;
            position: relative;
            height: 44px;
        }
        .plant-card:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 -4px 0 #b89e7a, 0 6px 14px rgba(0, 0, 0, 0.35);
        }
        .plant-card:active {
            transform: translateY(2px);
            box-shadow: inset 0 -2px 0 #b89e7a;
        }
        .plant-card.selected {
            border-color: #ffd966;
            box-shadow: inset 0 -4px 0 #b89e7a, 0 0 0 3px #ffd966, 0 4px 12px rgba(255, 215, 0, 0.4);
            transform: scale(1.03);
        }
        .plant-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.6);
            transform: none !important;
        }
        .plant-card .plant-emoji {
            font-size: 20px;
            line-height: 1.1;
        }
        .plant-card .plant-name {
            font-size: 8px;
            font-weight: 600;
            color: #3d2b1a;
            letter-spacing: 0.2px;
            line-height: 1.1;
        }
        .plant-card .plant-cost {
            font-size: 9px;
            font-weight: 700;
            color: #7a5a2a;
            background: #f5e56b;
            padding: 0 6px;
            border-radius: 20px;
            margin-top: 1px;
            box-shadow: inset 0 -2px 0 #b89e3a;
            line-height: 1.2;
        }
        .plant-card.shovel-card {
            background: #d4c4a0;
            min-width: 44px;
        }
        .plant-card.shovel-card .plant-emoji {
            font-size: 18px;
        }
        #gameCanvas {
            display: block;
            border-radius: 14px;
            background: #7cb85c;
            box-shadow: inset 0 0 0 3px #4f7a38, 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 720px;
            height: 400px;
            cursor: default;
            image-rendering: pixelated;
            touch-action: none;
        }
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            line-height: 0;
        }
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 14px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            z-index: 20;
        }
        #game-over-overlay.show {
            display: flex;
        }
        #game-over-overlay h1 {
            color: #ff6b4a;
            font-size: 40px;
            text-shadow: 0 4px 20px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        #game-over-overlay p {
            color: #f5e6c8;
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 14px;
        }
        #game-over-overlay .restart-btn {
            background: #f5e56b;
            border: none;
            padding: 10px 34px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            color: #3d2b1a;
            cursor: pointer;
            box-shadow: 0 6px 0 #b89e3a, 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.08s ease;
        }
        #game-over-overlay .restart-btn:hover {
            transform: scale(1.05);
        }
        #game-over-overlay .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b89e3a;
        }
        @media (max-width: 750px) {
            #game-container {
                padding: 8px 10px 10px 10px;
                border-radius: 18px;
            }
            #toolbar {
                min-width: unset;
                width: 100%;
                height: 44px;
                padding: 3px 6px;
                flex-wrap: nowrap;
            }
            .sun-counter,
            .energy-counter {
                font-size: 16px;
                height: 28px;
                padding: 0 8px;
            }
            .plant-card {
                min-width: 36px;
                height: 36px;
                padding: 1px 4px;
            }
            .plant-card .plant-emoji {
                font-size: 16px;
            }
            .plant-card .plant-name {
                font-size: 6px;
            }
            .plant-card .plant-cost {
                font-size: 7px;
                padding: 0 3px;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
                aspect-ratio: 720 / 400;
            }
            #version {
                font-size: 10px;
                top: 4px;
                right: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="version">v2.2</div>

            <div id="toolbar">
                <div class="sun-counter">
                    <span class="sun-icon">☀️</span>
                    <span id="sunDisplay">150</span>
                </div>
                <div class="energy-counter" id="energyCounter" title="点击切换能量豆模式 (消耗1颗)">
                    <span class="energy-icon">💚</span>
                    <span id="energyDisplay">0</span>
                </div>
                <div class="cards">
                    <div class="plant-card" data-plant="sunflower" id="card-sunflower">
                        <span class="plant-emoji">🌻</span>
                        <span class="plant-name">向日葵</span>
                        <span class="plant-cost">50</span>
                    </div>
                    <div class="plant-card" data-plant="peashooter" id="card-peashooter">
                        <span class="plant-emoji">🌱</span>
                        <span class="plant-name">射手</span>
                        <span class="plant-cost">100</span>
                    </div>
                    <div class="plant-card" data-plant="wallnut" id="card-wallnut">
                        <span class="plant-emoji">🥜</span>
                        <span class="plant-name">坚果墙</span>
                        <span class="plant-cost">50</span>
                    </div>
                    <div class="plant-card" data-plant="cherrybomb" id="card-cherrybomb">
                        <span class="plant-emoji">🍒</span>
                        <span class="plant-name">樱桃炸弹</span>
                        <span class="plant-cost">150</span>
                    </div>
                    <div class="plant-card" data-plant="lightning" id="card-lightning">
                        <span class="plant-emoji">⚡</span>
                        <span class="plant-name">闪电芦苇</span>
                        <span class="plant-cost">125</span>
                    </div>
                    <div class="plant-card shovel-card" data-plant="shovel" id="card-shovel">
                        <span class="plant-emoji">🔧</span>
                        <span class="plant-name">铲子</span>
                        <span class="plant-cost"> </span>
                    </div>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="720" height="400"></canvas>
                <div id="game-over-overlay">
                    <h1>💀 游戏结束</h1>
                    <p id="gameOverMsg">僵尸入侵了你的花园！</p>
                    <button class="restart-btn" id="restartBtn">🔄 重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🌻 植物大战僵尸 · 终极版  v2.2
        //  修复BOSS踩踏：只清除BOSS脚下附近植物，不再整行秒杀
        // ================================================================

        // ---------- 配置 ----------
        const CONFIG = {
            ROWS: 5,
            COLS: 9,
            CELL_SIZE: 80,
            TOP_OFFSET: 0,
            INITIAL_SUN: 150,
            SUN_INTERVAL: 5000,
            ZOMBIE_SPAWN_MIN: 2000,
            ZOMBIE_SPAWN_MAX: 6000,
            ENERGY_DROP_RATE: 0.08,
            MAX_ENERGY: 5,
            BOSS_TRIGGER_KILLS: 100,
        };

        // 植物类型定义
        const PLANT_TYPES = {
            SUNFLOWER: 'sunflower',
            PEASHOOTER: 'peashooter',
            WALLNUT: 'wallnut',
            CHERRYBOMB: 'cherrybomb',
            LIGHTNING: 'lightning',
        };

        const PLANT_CONFIG = {
            sunflower: { cost: 50, hp: 100, name: '向日葵' },
            peashooter: { cost: 100, hp: 100, name: '射手' },
            wallnut: { cost: 50, hp: 400, name: '坚果墙' },
            cherrybomb: { cost: 150, hp: 1, name: '樱桃炸弹' },
            lightning: { cost: 125, hp: 100, name: '闪电芦苇' },
        };

        const ZOMBIE_TYPES = {
            basic: { hp: 200, speed: 0.40, name: '普通', color: '#6d8a7a' },
            cone: { hp: 420, speed: 0.35, name: '路障', color: '#d97a3a' },
            bucket: { hp: 720, speed: 0.25, name: '铁桶', color: '#7a8a9a' },
        };
        const ZOMBIE_WEIGHTS = { basic: 5, cone: 3, bucket: 1 };

        // ---------- DOM ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sunDisplay = document.getElementById('sunDisplay');
        const energyDisplay = document.getElementById('energyDisplay');
        const energyCounter = document.getElementById('energyCounter');
        const overlay = document.getElementById('game-over-overlay');
        const gameOverMsg = document.getElementById('gameOverMsg');
        const restartBtn = document.getElementById('restartBtn');

        const cards = {
            sunflower: document.getElementById('card-sunflower'),
            peashooter: document.getElementById('card-peashooter'),
            wallnut: document.getElementById('card-wallnut'),
            cherrybomb: document.getElementById('card-cherrybomb'),
            lightning: document.getElementById('card-lightning'),
            shovel: document.getElementById('card-shovel'),
        };

        // ---------- 游戏状态 ----------
        let game = {
            sun: CONFIG.INITIAL_SUN,
            energy: 0,
            selectedTool: null,
            plants: [],
            zombies: [],
            projectiles: [],
            suns: [],
            energyBeans: [],
            grid: [],
            gameOver: false,
            score: 0,
            killCount: 0,
            frame: 0,
            lastSunDrop: 0,
            lastZombieSpawn: 0,
            zombieSpawnInterval: 6000,
            bossActive: false,
            boss: null,
            bossSpawned: false,
            energyMode: false,
            effects: [],
        };

        // ---------- 鼠标位置 ----------
        let mouseX = -1000,
            mouseY = -1000;

        // ---------- 工具 ----------
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function cellToPixel(row, col) {
            return {
                x: col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                y: row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + CONFIG.TOP_OFFSET,
            };
        }

        function pixelToCell(px, py) {
            const col = Math.floor(px / CONFIG.CELL_SIZE);
            const row = Math.floor((py - CONFIG.TOP_OFFSET) / CONFIG.CELL_SIZE);
            if (row >= 0 && row < CONFIG.ROWS && col >= 0 && col < CONFIG.COLS) {
                return { row, col, valid: true };
            }
            return { row, col, valid: false };
        }

        function weightedRandom(weights) {
            let total = 0;
            for (let key in weights) total += weights[key];
            let r = Math.random() * total;
            for (let key in weights) {
                r -= weights[key];
                if (r <= 0) return key;
            }
            return Object.keys(weights)[0];
        }

        // ---------- 网格 ----------
        function initGrid() {
            game.grid = [];
            for (let r = 0; r < CONFIG.ROWS; r++) {
                game.grid.push(new Array(CONFIG.COLS).fill(null));
            }
        }

        // ========== 实体类 ==========

        // ----- 植物基类 -----
        class Plant {
            constructor(row, col, type) {
                this.row = row;
                this.col = col;
                this.type = type;
                const pos = cellToPixel(row, col);
                this.x = pos.x;
                this.y = pos.y;
                const cfg = PLANT_CONFIG[type];
                this.maxHp = cfg.hp;
                this.hp = cfg.hp;
                this.timer = 0;
                this.animTimer = 0;
                this.ultraActive = false;
                this.ultraTimer = 0;

                if (type === PLANT_TYPES.SUNFLOWER) {
                    this.sunCooldown = 6000 + rand(0, 2000);
                    this.sunTimer = 0;
                } else if (type === PLANT_TYPES.PEASHOOTER) {
                    this.shootCooldown = 1200;
                    this.shootTimer = 0;
                } else if (type === PLANT_TYPES.LIGHTNING) {
                    this.shootCooldown = 1600;
                    this.shootTimer = 0;
                } else if (type === PLANT_TYPES.CHERRYBOMB) {
                    this.exploded = false;
                    this.explodeTimer = 500;
                    this.explosionDone = false;
                }
            }

            activateUltra() {
                if (this.ultraActive) return;
                this.ultraActive = true;
                this.ultraTimer = 3000;
                if (this.type === PLANT_TYPES.SUNFLOWER) {
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            const sun = new Sun(
                                this.x + rand(-40, 40),
                                this.y - 20,
                                this.x + rand(-60, 60),
                                this.y + rand(20, 60),
                                true
                            );
                            game.suns.push(sun);
                        }, i * 100);
                    }
                } else if (this.type === PLANT_TYPES.PEASHOOTER) {
                    // 急速射击
                } else if (this.type === PLANT_TYPES.WALLNUT) {
                    this.maxHp += 200;
                    this.hp = this.maxHp;
                } else if (this.type === PLANT_TYPES.LIGHTNING) {
                    // 强化闪电链
                }
            }

            update(dt) {
                if (this.ultraActive) {
                    this.ultraTimer -= dt;
                    if (this.ultraTimer <= 0) {
                        this.ultraActive = false;
                        if (this.type === PLANT_TYPES.PEASHOOTER) {
                            this.shootCooldown = 1200;
                        }
                    }
                }

                this.animTimer += dt;

                if (this.type === PLANT_TYPES.SUNFLOWER) {
                    this.sunTimer += dt;
                    if (this.sunTimer >= this.sunCooldown) {
                        this.sunTimer = 0;
                        this.sunCooldown = 6000 + rand(0, 2000);
                        const sun = new Sun(
                            this.x + rand(-20, 20),
                            this.y - 10,
                            this.x + rand(-30, 30),
                            this.y + 30,
                            true
                        );
                        game.suns.push(sun);
                    }
                } else if (this.type === PLANT_TYPES.PEASHOOTER) {
                    if (this.ultraActive) this.shootCooldown = 150;
                    this.shootTimer += dt;
                    const hasTarget = game.zombies.some(z =>
                        z.row === this.row && z.x > this.x && z.hp > 0 && !z.dead
                    );
                    if (hasTarget && this.shootTimer >= this.shootCooldown) {
                        this.shootTimer = 0;
                        const proj = new Projectile(this.x + 30, this.y - 6, this.row, this.ultraActive);
                        game.projectiles.push(proj);
                        if (this.ultraActive) {
                            game.projectiles.push(new Projectile(this.x + 30, this.y - 18, this.row, false));
                            game.projectiles.push(new Projectile(this.x + 30, this.y + 6, this.row, false));
                        }
                    }
                } else if (this.type === PLANT_TYPES.LIGHTNING) {
                    if (this.ultraActive) this.shootCooldown = 300;
                    this.shootTimer += dt;
                    const hasTarget = game.zombies.some(z =>
                        z.row === this.row && z.x > this.x && z.hp > 0 && !z.dead
                    );
                    if (hasTarget && this.shootTimer >= this.shootCooldown) {
                        this.shootTimer = 0;
                        const targets = game.zombies
                            .filter(z => z.row === this.row && z.x > this.x && !z.dead)
                            .sort((a, b) => a.x - b.x);
                        const count = Math.min(targets.length, 3);
                        for (let i = 0; i < count; i++) {
                            const t = targets[i];
                            const dmg = this.ultraActive ? 30 : 18;
                            t.hp -= dmg;
                            if (t.hp <= 0) {
                                t.dead = true;
                                game.killCount++;
                                game.score++;
                                if (t.dropEnergy && game.energy < CONFIG.MAX_ENERGY) {
                                    game.energy++;
                                    updateEnergyDisplay();
                                }
                            }
                            const proj = new Projectile(this.x + 20, this.y - 6 + i * 6, this.row, false);
                            proj.speed = 10;
                            proj.radius = 6;
                            proj.damage = 0;
                            proj.isLightning = true;
                            proj.targetX = t.x;
                            proj.targetY = t.y;
                            proj.life = 100;
                            game.projectiles.push(proj);
                        }
                    }
                } else if (this.type === PLANT_TYPES.CHERRYBOMB) {
                    if (!this.exploded) {
                        this.explodeTimer -= dt;
                        if (this.explodeTimer <= 0 && !this.explosionDone) {
                            this.exploded = true;
                            this.explosionDone = true;
                            const row = this.row,
                                col = this.col;
                            for (let dr = -1; dr <= 1; dr++) {
                                for (let dc = -1; dc <= 1; dc++) {
                                    const r = row + dr,
                                        c = col + dc;
                                    if (r < 0 || r >= CONFIG.ROWS || c < 0 || c >= CONFIG.COLS) continue;
                                    for (const zombie of game.zombies) {
                                        if (zombie.dead) continue;
                                        const zRow = zombie.row,
                                            zCol = Math.floor((zombie.x - 40) / CONFIG.CELL_SIZE);
                                        if (zRow === r && zCol === c) {
                                            zombie.hp -= 1800;
                                            if (zombie.hp <= 0) {
                                                zombie.dead = true;
                                                game.killCount++;
                                                game.score++;
                                                if (zombie.dropEnergy && game.energy < CONFIG.MAX_ENERGY) {
                                                    game.energy++;
                                                    updateEnergyDisplay();
                                                }
                                            }
                                        }
                                    }
                                    if (r === row && c === col) continue;
                                    const plant = game.grid[r][c];
                                    if (plant) {
                                        const idx = game.plants.indexOf(plant);
                                        if (idx !== -1) {
                                            game.plants.splice(idx, 1);
                                            game.grid[r][c] = null;
                                        }
                                    }
                                }
                            }
                            createExplosionEffect(this.x, this.y, 1.5);
                            setTimeout(() => {
                                const idx = game.plants.indexOf(this);
                                if (idx !== -1) {
                                    game.plants.splice(idx, 1);
                                    game.grid[this.row][this.col] = null;
                                }
                            }, 200);
                        }
                    }
                }
            }

            draw(ctx) {
                const x = this.x,
                    y = this.y;
                const s = CONFIG.CELL_SIZE * 0.7;

                if (this.type === PLANT_TYPES.SUNFLOWER) this.drawSunflower(ctx, x, y, s);
                else if (this.type === PLANT_TYPES.PEASHOOTER) this.drawPeashooter(ctx, x, y, s);
                else if (this.type === PLANT_TYPES.WALLNUT) this.drawWallnut(ctx, x, y, s);
                else if (this.type === PLANT_TYPES.CHERRYBOMB) this.drawCherryBomb(ctx, x, y, s);
                else if (this.type === PLANT_TYPES.LIGHTNING) this.drawLightning(ctx, x, y, s);

                if (this.ultraActive) {
                    ctx.shadowColor = 'rgba(255, 200, 50, 0.8)';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                if (this.hp < this.maxHp && this.type !== PLANT_TYPES.CHERRYBOMB) {
                    const bw = 40,
                        bh = 4;
                    const bx = x - bw / 2,

            drawWallnut(ctx, x, y, s) {

            drawCherryBomb(ctx, x, y, s) {
