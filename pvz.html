<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌻 植物大战僵尸 · 增强版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1d3e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            margin: 0;
        }

        #game-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        #game-container {
            background: #5b8c3e;
            padding: 16px 20px 20px 20px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 2px #7fb35a;
            display: inline-block;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.1s ease;
            will-change: transform;
        }

        /* ===== 顶部工具栏 ===== */
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #4a7a30;
            padding: 6px 12px 6px 14px;
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: inset 0 -3px 0 #2d5720, 0 4px 8px rgba(0, 0, 0, 0.3);
            height: 58px;
            min-width: 680px;
            gap: 6px;
            flex-wrap: nowrap;
        }

        /* 阳光计数 */
        .sun-counter {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f5e56b;
            padding: 2px 14px 2px 10px;
            border-radius: 30px;
            box-shadow: inset 0 -3px 0 #b89e3a, 0 2px 6px rgba(0, 0, 0, 0.25);
            font-weight: bold;
            font-size: 24px;
            color: #4d3500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            height: 40px;
        }
        .sun-counter .sun-icon {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
        }

        /* 卡片容器 */
        .cards {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            align-items: center;
        }

        .plant-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e8d6b0;
            padding: 2px 10px 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 #b89e7a, 0 4px 8px rgba(0, 0, 0, 0.25);
            transition: all 0.1s ease;
            min-width: 56px;
            border: 2px solid transparent;
            position: relative;
            height: 48px;
        }
        .plant-card:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 -4px 0 #b89e7a, 0 6px 14px rgba(0, 0, 0, 0.35);
        }
        .plant-card:active {
            transform: translateY(2px);
            box-shadow: inset 0 -2px 0 #b89e7a;
        }
        .plant-card.selected {
            border-color: #ffd966;
            box-shadow: inset 0 -4px 0 #b89e7a, 0 0 0 3px #ffd966, 0 4px 12px rgba(255, 215, 0, 0.4);
            transform: scale(1.03);
        }
        .plant-card.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.6);
            transform: none !important;
        }
        .plant-card .plant-emoji {
            font-size: 22px;
            line-height: 1.1;
        }
        .plant-card .plant-name {
            font-size: 9px;
            font-weight: 600;
            color: #3d2b1a;
            letter-spacing: 0.2px;
            line-height: 1.1;
        }
        .plant-card .plant-cost {
            font-size: 10px;
            font-weight: 700;
            color: #7a5a2a;
            background: #f5e56b;
            padding: 0 8px;
            border-radius: 20px;
            margin-top: 1px;
            box-shadow: inset 0 -2px 0 #b89e3a;
            line-height: 1.2;
        }
        /* 铲子特殊样式 */
        .plant-card.shovel-card {
            background: #d4c4a0;
            min-width: 50px;
        }
        .plant-card.shovel-card .plant-emoji {
            font-size: 20px;
        }

        /* ===== Canvas ===== */
        #gameCanvas {
            display: block;
            border-radius: 14px;
            background: #7cb85c;
            box-shadow: inset 0 0 0 3px #4f7a38, 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 720px;
            height: 400px;
            cursor: default;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* ===== 遮罩 ===== */
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 14px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            z-index: 20;
        }
        #game-over-overlay.show {
            display: flex;
        }
        #game-over-overlay h1 {
            color: #ff6b4a;
            font-size: 42px;
            text-shadow: 0 4px 20px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        #game-over-overlay p {
            color: #f5e6c8;
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 14px;
        }
        #game-over-overlay .restart-btn {
            background: #f5e56b;
            border: none;
            padding: 10px 36px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            color: #3d2b1a;
            cursor: pointer;
            box-shadow: 0 6px 0 #b89e3a, 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.08s ease;
        }
        #game-over-overlay .restart-btn:hover {
            transform: scale(1.05);
        }
        #game-over-overlay .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b89e3a;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            line-height: 0;
        }

        /* 响应式缩放 */
        @media (max-width: 750px) {
            #game-container {
                padding: 10px 12px 12px 12px;
                border-radius: 18px;
            }
            #toolbar {
                min-width: unset;
                width: 100%;
                height: 48px;
                padding: 4px 8px;
                flex-wrap: nowrap;
            }
            .sun-counter {
                font-size: 18px;
                height: 32px;
                padding: 0 10px;
            }
            .plant-card {
                min-width: 42px;
                height: 40px;
                padding: 1px 6px;
            }
            .plant-card .plant-emoji {
                font-size: 18px;
            }
            .plant-card .plant-name {
                font-size: 7px;
            }
            .plant-card .plant-cost {
                font-size: 8px;
                padding: 0 4px;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
                aspect-ratio: 720 / 400;
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <!-- 工具栏 -->
            <div id="toolbar">
                <div class="sun-counter">
                    <span class="sun-icon">☀️</span>
                    <span id="sunDisplay">150</span>
                </div>
                <div class="cards">
                    <div class="plant-card" data-plant="sunflower" id="card-sunflower">
                        <span class="plant-emoji">🌻</span>
                        <span class="plant-name">向日葵</span>
                        <span class="plant-cost">50</span>
                    </div>
                    <div class="plant-card" data-plant="peashooter" id="card-peashooter">
                        <span class="plant-emoji">🌱</span>
                        <span class="plant-name">射手</span>
                        <span class="plant-cost">100</span>
                    </div>
                    <div class="plant-card" data-plant="wallnut" id="card-wallnut">
                        <span class="plant-emoji">🥜</span>
                        <span class="plant-name">坚果墙</span>
                        <span class="plant-cost">50</span>
                    </div>
                    <div class="plant-card" data-plant="potato" id="card-potato">
                        <span class="plant-emoji">🥔</span>
                        <span class="plant-name">土豆雷</span>
                        <span class="plant-cost">25</span>
                    </div>
                    <div class="plant-card shovel-card" data-plant="shovel" id="card-shovel">
                        <span class="plant-emoji">🔧</span>
                        <span class="plant-name">铲子</span>
                        <span class="plant-cost" style="background:#d4c4a0;box-shadow:none;"> </span>
                    </div>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="720" height="400"></canvas>
                <div id="game-over-overlay">
                    <h1>💀 游戏结束</h1>
                    <p>僵尸入侵了你的花园！</p>
                    <button class="restart-btn" id="restartBtn">🔄 重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🌻 植物大战僵尸 · 增强版  –  完整游戏逻辑
        // ================================================================

        // ---------- 配置 ----------
        const CONFIG = {
            ROWS: 5,
            COLS: 9,
            CELL_SIZE: 80,
            TOP_OFFSET: 0,
            INITIAL_SUN: 150,
            SUN_INTERVAL: 5000,
            ZOMBIE_SPAWN_MIN: 3000,
            ZOMBIE_SPAWN_MAX: 8000,
            ENERGY_DROP_RATE: 0.15, // 15% 概率掉落能量豆
        };

        // 植物类型定义
        const PLANT_TYPES = {
            SUNFLOWER: 'sunflower',
            PEASHOOTER: 'peashooter',
            WALLNUT: 'wallnut',
            POTATO: 'potato',
        };

        const PLANT_CONFIG = {
            sunflower: { cost: 50, hp: 100, name: '向日葵' },
            peashooter: { cost: 100, hp: 100, name: '射手' },
            wallnut: { cost: 50, hp: 400, name: '坚果墙' },
            potato: { cost: 25, hp: 60, name: '土豆雷' },
        };

        // 僵尸类型定义
        const ZOMBIE_TYPES = {
            basic: { hp: 200, speed: 0.40, name: '普通', color: '#6d8a7a' },
            cone: { hp: 420, speed: 0.35, name: '路障', color: '#d97a3a' },
            bucket: { hp: 720, speed: 0.25, name: '铁桶', color: '#7a8a9a' },
        };
        const ZOMBIE_WEIGHTS = { basic: 5, cone: 3, bucket: 1 };

        // ---------- DOM 引用 ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sunDisplay = document.getElementById('sunDisplay');
        const overlay = document.getElementById('game-over-overlay');
        const restartBtn = document.getElementById('restartBtn');

        const cards = {
            sunflower: document.getElementById('card-sunflower'),
            peashooter: document.getElementById('card-peashooter'),
            wallnut: document.getElementById('card-wallnut'),
            potato: document.getElementById('card-potato'),
            shovel: document.getElementById('card-shovel'),
        };

        // ---------- 游戏状态 ----------
        let game = {
            sun: CONFIG.INITIAL_SUN,
            selectedTool: null, // 'sunflower' | 'peashooter' | 'wallnut' | 'potato' | 'shovel' | null
            plants: [],
            zombies: [],
            projectiles: [],
            suns: [],
            energyBeans: [],
            grid: [],
            gameOver: false,
            score: 0,
            frame: 0,
            lastSunDrop: 0,
            lastZombieSpawn: 0,
            zombieSpawnInterval: 6000,
            // 大招状态
            ultraMode: false, // 是否处于喂食能量豆模式
        };

        // ---------- 工具函数 ----------
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function cellToPixel(row, col) {
            return {
                x: col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                y: row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + CONFIG.TOP_OFFSET,
            };
        }

        function pixelToCell(px, py) {
            const col = Math.floor(px / CONFIG.CELL_SIZE);
            const row = Math.floor((py - CONFIG.TOP_OFFSET) / CONFIG.CELL_SIZE);
            if (row >= 0 && row < CONFIG.ROWS && col >= 0 && col < CONFIG.COLS) {
                return { row, col, valid: true };
            }
            return { row, col, valid: false };
        }

        function weightedRandom(weights) {
            let total = 0;
            for (let key in weights) total += weights[key];
            let r = Math.random() * total;
            for (let key in weights) {
                r -= weights[key];
                if (r <= 0) return key;
            }
            return Object.keys(weights)[0];
        }

        // ---------- 初始化网格 ----------
        function initGrid() {
            game.grid = [];
            for (let r = 0; r < CONFIG.ROWS; r++) {
                game.grid.push(new Array(CONFIG.COLS).fill(null));
            }
        }

        // ========== 实体类 ==========

        // ----- 植物 -----
        class Plant {
            constructor(row, col, type) {
                this.row = row;
                this.col = col;
                this.type = type;
                const pos = cellToPixel(row, col);
                this.x = pos.x;
                this.y = pos.y;
                const cfg = PLANT_CONFIG[type];
                this.maxHp = cfg.hp;
                this.hp = cfg.hp;
                this.timer = 0;
                this.animTimer = 0;

                // 特殊属性
                if (type === PLANT_TYPES.SUNFLOWER) {
                    this.sunCooldown = 6000 + rand(0, 2000);
                    this.sunTimer = 0;
                } else if (type === PLANT_TYPES.PEASHOOTER) {
                    this.shootCooldown = 1200;
                    this.shootTimer = 0;
                    this.ultraActive = false;
                    this.ultraTimer = 0;
                } else if (type === PLANT_TYPES.POTATO) {
                    this.armTimer = 0;
                    this.armed = false;
                    this.armTime = 3000; // 3秒准备
                    this.exploded = false;
                } else if (type === PLANT_TYPES.WALLNUT) {
                    // 无特殊
                }
                // 大招通用
                this.ultraActive = false;
                this.ultraTimer = 0;
            }

            activateUltra() {
                if (this.ultraActive) return;
                this.ultraActive = true;
                this.ultraTimer = 3000; // 持续3秒

                if (this.type === PLANT_TYPES.SUNFLOWER) {
                    // 产生大量阳光
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            const sun = new Sun(
                                this.x + rand(-40, 40),
                                this.y - 20,
                                this.x + rand(-60, 60),
                                this.y + rand(20, 60),
                                true
                            );
                            game.suns.push(sun);
                        }, i * 100);
                    }
                } else if (this.type === PLANT_TYPES.PEASHOOTER) {
                    // 快速连射，由update处理
                } else if (this.type === PLANT_TYPES.WALLNUT) {
                    this.maxHp += 200;
                    this.hp = this.maxHp;
                } else if (this.type === PLANT_TYPES.POTATO) {
                    // 立即爆炸
                    this.armed = true;
                    this.armTimer = this.armTime;
                    this.explode();
                }
            }

            explode() {
                if (this.exploded) return;
                this.exploded = true;
                // 对周围僵尸造成大量伤害
                for (const zombie of game.zombies) {
                    if (zombie.dead) continue;
                    if (Math.abs(zombie.x - this.x) < 100 && Math.abs(zombie.y - this.y) < 80) {
                        zombie.hp -= 1800;
                        if (zombie.hp <= 0) {
                            zombie.dead = true;
                            game.score += 10;
                        }
                    }
                }
                // 土豆雷消失
                setTimeout(() => {
                    const idx = game.plants.indexOf(this);
                    if (idx !== -1) {
                        game.plants.splice(idx, 1);
                        game.grid[this.row][this.col] = null;
                    }
                }, 100);
            }

            update(dt) {
                if (this.ultraActive) {
                    this.ultraTimer -= dt;
                    if (this.ultraTimer <= 0) {
                        this.ultraActive = false;
                        if (this.type === PLANT_TYPES.PEASHOOTER) {
                            this.shootCooldown = 1200; // 恢复
                        }
                    }
                }

                this.animTimer += dt;
                if (this.type === PLANT_TYPES.SUNFLOWER) {
                    this.sunTimer += dt;
                    if (this.sunTimer >= this.sunCooldown) {
                        this.sunTimer = 0;
                        this.sunCooldown = 6000 + rand(0, 2000);
                        const sun = new Sun(
                            this.x + rand(-20, 20),
                            this.y - 10,
                            this.x + rand(-30, 30),
                            this.y + 30,
                            true
                        );
                        game.suns.push(sun);
                    }
                } else if (this.type === PLANT_TYPES.PEASHOOTER) {
                    if (this.ultraActive) {
                        this.shootCooldown = 150; // 大招极速射击
                    }
                    this.shootTimer += dt;
                    const hasTarget = game.zombies.some(z =>
                        z.row === this.row && z.x > this.x && z.hp > 0 && !z.dead
                    );
                    if (hasTarget && this.shootTimer >= this.shootCooldown) {
                        this.shootTimer = 0;
                        const proj = new Projectile(
                            this.x + 30,
                            this.y - 6,
                            this.row,
                            this.ultraActive // 大招子弹加强？
                        );
                        game.projectiles.push(proj);
                        // 大招时额外发射2颗
                        if (this.ultraActive) {
                            const p2 = new Projectile(this.x + 30, this.y - 18, this.row, false);
                            const p3 = new Projectile(this.x + 30, this.y + 6, this.row, false);
                            game.projectiles.push(p2, p3);
                        }
                    }
                } else if (this.type === PLANT_TYPES.POTATO) {
                    if (!this.exploded) {
                        this.armTimer += dt;
                        if (this.armTimer >= this.armTime && !this.armed) {
                            this.armed = true;
                        }
                        // 检查僵尸踩到
                        if (this.armed) {
                            for (const zombie of game.zombies) {
                                if (zombie.dead) continue;
                                if (zombie.row === this.row && Math.abs(zombie.x - this.x) < 40) {
                                    this.explode();
                                    break;
                                }
                            }
                        }
                    }
                }
            }

            draw(ctx) {
                const x = this.x,
                    y = this.y;
                const s = CONFIG.CELL_SIZE * 0.7;

                // ---- 绘制不同植物 ----
                if (this.type === PLANT_TYPES.SUNFLOWER) {
                    this.drawSunflower(ctx, x, y, s);
                } else if (this.type === PLANT_TYPES.PEASHOOTER) {
                    this.drawPeashooter(ctx, x, y, s);
                } else if (this.type === PLANT_TYPES.WALLNUT) {
                    this.drawWallnut(ctx, x, y, s);
                } else if (this.type === PLANT_TYPES.POTATO) {
                    this.drawPotato(ctx, x, y, s);
                }

                // 大招特效（发光圈）
                if (this.ultraActive) {
                    ctx.shadowColor = 'rgba(255, 200, 50, 0.8)';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // 血条
                if (this.hp < this.maxHp) {
                    const bw = 40,
                        bh = 4;
                    const bx = x - bw / 2,
                        by = y - s * 0.6 - 6;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = this.hp / this.maxHp > 0.3 ? '#4caf50' : '#f44336';
                    ctx.fillRect(bx + 1, by + 1, (bw - 2) * (this.hp / this.maxHp), bh - 2);
                }
            }

            // ---- 各植物绘制 ----
            drawSunflower(ctx, x, y, s) {
                const bob = Math.sin(this.animTimer * 0.002) * 2;
                const petalCount = 10;
                for (let i = 0; i < petalCount; i++) {
                    const angle = (i / petalCount) * Math.PI * 2 + this.animTimer * 0.0005;
                    const r = s * 0.45;
                    const px = x + Math.cos(angle) * r;
                    const py = y + Math.sin(angle) * r * 0.85 + bob;
                    ctx.beginPath();
                    ctx.ellipse(px, py, 12, 8, angle, 0, Math.PI * 2);
                    ctx.fillStyle = '#fadb3a';
                    ctx.shadowColor = 'rgba(0,0,0,0.1)';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#d4a020';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(x, y + bob, s * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#7a4a2a';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
                for (let i = 0; i < 12; i++) {
                    const a = i * 0.8 + 0.2;
                    const r2 = s * 0.16;
                    const px2 = x + Math.cos(a + i) * r2;
                    const py2 = y + Math.sin(a + i) * r2 * 0.7 + bob;
                    ctx.beginPath();
                    ctx.arc(px2, py2, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#5a3a1a';
                    ctx.fill();
                }
                ctx.fillStyle = '#3d2b1a';
                ctx.beginPath();
                ctx.arc(x - 6, y - 4 + bob, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 6, y - 4 + bob, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y + 4 + bob, 8, 0.1, Math.PI - 0.1);
                ctx.strokeStyle = '#3d2b1a';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            drawPeashooter(ctx, x, y, s) {
                const bob = Math.sin(this.animTimer * 0.003) * 1.5;
                // 茎+叶
                ctx.fillStyle = '#3d8a3d';
                ctx.fillRect(x - 4, y + 12 + bob, 8, 22);
                ctx.fillStyle = '#4caf50';
                ctx.beginPath();

                ctx.beginPath();
                ctx.ellipse(x - 6, y - 8 + bob, 10, 12, 0, 0, Math.PI * 2);

                ctx.beginPath();
                ctx.ellipse(x + 10, y - 8 + bob, 10, 12, 0, 0, Math.PI * 2);

                ctx.fillStyle = '#1d3a1d';

                ctx.beginPath();
                ctx.arc(x + 12, y - 5 + bob, 5, 0, Math.PI * 2);

                ctx.fill();
                // 大招时眼睛发光
                if (this.ultraActive) {
                    ctx.shadowColor = 'rgba(255, 200, 50, 0.9)';

            drawWallnut(ctx, x, y, s) {
                const bob = Math.sin(this.animTimer * 0.001) * 1;
                // 身体
                ctx.shadowColor = 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 8;
                const grad = ctx.createRadialGradient(x - 10, y - 10 + bob, 6, x, y + bob, s * 0.55);
                grad.addColorStop(0, '#d4a86a');
                grad.addColorStop(0.6, '#b88a4a');
                grad.addColorStop(1, '#8a6a2a');
                ctx.beginPath();
                ctx.ellipse(x, y + bob, s * 0.48, s * 0.55, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                // 裂纹
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#6a4a1a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - 10, y - 8 + bob);
                ctx.quadraticCurveTo(x - 2, y + 4 + bob, x - 14, y + 12 + bob);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + 8, y - 12 + bob);
                ctx.quadraticCurveTo(x + 16, y + 2 + bob, x + 4, y + 14 + bob);
                ctx.stroke();
                // 表情 (坚定)
                ctx.fillStyle = '#3d2b1a';
                ctx.beginPath();
                ctx.arc(x - 10, y - 8 + bob, 4, 0, Math.PI * 2);

                ctx.beginPath();
                ctx.arc(x + 10, y - 8 + bob, 4, 0, Math.PI * 2);

                ctx.arc(x, y + 4 + bob, 10, 0.1, Math.PI - 0.1);

            drawPotato(ctx, x, y, s) {

                const grad = ctx.createRadialGradient(x - 6, y - 6 + bob, 4, x, y + bob, s * 0.5);
                grad.addColorStop(0, '#c49a6a');
                grad.addColorStop(0.7, '#8a6a3a');
                grad.addColorStop(1, '#5a4020');
                ctx.beginPath();
                ctx.ellipse(x, y + bob, s * 0.45, s * 0.4, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                // 眼睛
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.arc(x - 12, y - 6 + bob, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 12, y - 6 + bob, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x - 10, y - 9 + bob, 1.8, 0, Math.PI * 2);

                ctx.arc(x + 14, y - 9 + bob, 1.8, 0, Math.PI * 2);

                if (this.armed && !this.exploded) {
                    ctx.fillStyle = '#8a2a2a';

                    ctx.moveTo(x + 16, y - 8 + bob);
                    ctx.lineTo(x + 30, y - 20 + bob);
                    ctx.lineTo(x + 34, y - 12 + bob);

                    ctx.arc(x + 34, y - 12 + bob, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.lineTo(x + 28, y - 16 + bob);
                    ctx.lineTo(x + 30, y - 10 + bob);
                    ctx.fill();
                }

                    ctx.fillStyle = 'rgba(0,0,0,0.3)';

        // ----- 僵尸 -----
        class Zombie {
            constructor(row, type = 'basic') {
                this.row = row;
                const cfg = ZOMBIE_TYPES[type];
                this.x = CONFIG.COLS * CONFIG.CELL_SIZE + 20 + rand(0, 60);
                this.y = row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + CONFIG.TOP_OFFSET;
                this.maxHp = cfg.hp + randInt(0, 40);
                this.hp = this.maxHp;
                this.speed = cfg.speed + rand(-0.03, 0.03);
                this.type = type;
                this.name = cfg.name;
                this.color = cfg.color;
                this.attackCooldown = 0;
                this.attackInterval = 800;
                this.damage = 10;
                this.isAttacking = false;
                this.animTimer = rand(0, 100);
                this.dead = false;
                this.dropEnergy = Math.random() < CONFIG.ENERGY_DROP_RATE;
            }

            update(dt) {
                if (this.dead) return;
                this.animTimer += dt;

                let targetPlant = null;
                for (const plant of game.plants) {
                    if (plant.row === this.row && Math.abs(plant.x - this.x) < 42) {
                        targetPlant = plant;
                        break;
                    }
                }

                if (targetPlant) {
                    this.isAttacking = true;
                    this.attackCooldown += dt;
                    if (this.attackCooldown >= this.attackInterval) {
                        this.attackCooldown = 0;
                        targetPlant.hp -= this.damage;
                        if (targetPlant.hp <= 0) {
                            const idx = game.plants.indexOf(targetPlant);
                            if (idx !== -1) {
                                game.plants.splice(idx, 1);
                                game.grid[targetPlant.row][targetPlant.col] = null;
                            }
                        }
                    }
                } else {
                    this.isAttacking = false;
                    this.attackCooldown = 0;
                    this.x -= this.speed * dt * 0.06;
                }

                if (this.x < -20) {
                    game.gameOver = true;
                    overlay.classList.add('show');
                }
            }

            draw(ctx) {
                if (this.dead) return;
                const x = this.x,
                    y = this.y;
                const wobble = Math.sin(this.animTimer * 0.06) * 2;

                // 身体
                const grad = ctx.createRadialGradient(x - 6, y - 10, 4, x, y, 32);
                grad.addColorStop(0, this.color);
                grad.addColorStop(0.7, '#3d5a4a');
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.ellipse(x, y + 4 + wobble, 22, 30, 0, 0, Math.PI * 2);
                ctx.fill();

                // 衣服
                ctx.fillStyle = '#3d4a5a';
                ctx.shadowBlur = 4;
                ctx.fillRect(x - 16, y + 6 + wobble, 32, 26);
                ctx.fillStyle = '#2d3a4a';
                ctx.fillRect(x - 12, y + 10 + wobble, 24, 8);

                // 头
                ctx.shadowBlur = 8;
                const headGrad = ctx.createRadialGradient(x - 4, y - 18, 4, x, y - 10, 20);
                headGrad.addColorStop(0, '#8aaa8a');
                headGrad.addColorStop(0.7, '#4a6a5a');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.ellipse(x, y - 12 + wobble, 18, 20, 0, 0, Math.PI * 2);
                ctx.fill();

                // 路障 / 铁桶
                if (this.type === 'cone') {
                    ctx.fillStyle = '#d97a3a';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.moveTo(x - 16, y - 18 + wobble);
                    ctx.lineTo(x, y - 38 + wobble);
                    ctx.lineTo(x + 16, y - 18 + wobble);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#b85a2a';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#f5a86a';
                    ctx.beginPath();
                    ctx.arc(x, y - 28 + wobble, 4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'bucket') {
                    ctx.fillStyle = '#7a8a9a';
                    ctx.shadowBlur = 6;
                    ctx.fillRect(x - 16, y - 32 + wobble, 32, 22);
                    ctx.fillStyle = '#5a6a7a';
                    ctx.fillRect(x - 18, y - 32 + wobble, 4, 22);
                    ctx.fillRect(x + 14, y - 32 + wobble, 4, 22);
                    ctx.fillStyle = '#9aaab0';
                    ctx.fillRect(x - 14, y - 34 + wobble, 28, 4);
                    ctx.fillStyle = '#4a5a6a';
                    ctx.fillRect(x - 12, y - 28 + wobble, 24, 2);
                }

                // 眼睛
                ctx.shadowBlur = 12;
                ctx.shadowColor = 'rgba(255,0,0,0.4)';
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(x - 7, y - 16 + wobble, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 7, y - 16 + wobble, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(x - 6, y - 14 + wobble, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 8, y - 14 + wobble, 2, 0, Math.PI * 2);
                ctx.fill();

                // 嘴
                ctx.fillStyle = '#2a1a1a';
                ctx.beginPath();
                ctx.arc(x, y - 6 + wobble, 8, 0, Math.PI);
                ctx.fill();
                ctx.fillStyle = '#ddd';
                for (let i = -5; i <= 5; i += 4) {
                    ctx.fillRect(x + i - 1, y - 6 + wobble, 3, 5);
                }

                // 手臂
                ctx.fillStyle = '#5a7a6a';
                ctx.shadowBlur = 6;
                const armAngle = this.isAttacking ? Math.sin(this.animTimer * 0.1) * 0.6 + 0.8 : 0.2;
                ctx.fillRect(x - 30, y + 2 + wobble, 14, 6);
                ctx.fillRect(x + 16, y + 2 + wobble, 14, 6);
                ctx.fillRect(x - 34, y + 2 + wobble - 4, 6, 12);
                ctx.fillRect(x + 28, y + 2 + wobble - 4, 6, 12);
                ctx.shadowBlur = 0;

                // 血条
                const bw = 38,
                    bh = 4;
                const bx = x - bw / 2,
                    by = y - 38 + wobble;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(bx, by, bw, bh);
                const hpRatio = this.hp / this.maxHp;
                ctx.fillStyle = hpRatio > 0.4 ? '#66bb6a' : '#ef5350';
                ctx.fillRect(bx + 1, by + 1, (bw - 2) * hpRatio, bh - 2);
            }
        }

        // ----- 子弹 -----
        class Projectile {
            constructor(x, y, row, ultra = false) {
                this.x = x;
                this.y = y;
                this.row = row;
                this.speed = 5.5;
                this.radius = 9;
                this.damage = ultra ? 35 : 25;
                this.active = true;
                this.trail = [];
                this.ultra = ultra;
            }

            update() {
                if (!this.active) return;
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();
                this.x += this.speed;

                if (this.x > CONFIG.COLS * CONFIG.CELL_SIZE + 50) {
                    this.active = false;
                    return;
                }

                for (const zombie of game.zombies) {
                    if (zombie.dead) continue;
                    if (zombie.row === this.row && Math.abs(zombie.x - this.x) < 28 && Math.abs(zombie.y - this.y) < 30) {
                        zombie.hp -= this.damage;
                        this.active = false;
                        if (zombie.hp <= 0) {
                            zombie.dead = true;
                            game.score += 10;
                            // 能量豆掉落
                            if (zombie.dropEnergy) {
                                const bean = new EnergyBean(zombie.x, zombie.y - 10);
                                game.energyBeans.push(bean);
                            }
                        }
                        break;
                    }
                }
            }

            draw(ctx) {
                if (!this.active) return;
                for (let i = 0; i < this.trail.length; i++) {
                    const alpha = i / this.trail.length * 0.5;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, this.radius * (i / this.trail.length) * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = this.ultra ? `rgba(255, 220, 80, ${alpha})` : `rgba(120, 220, 80, ${alpha})`;
                    ctx.fill();
                }
                const grad = ctx.createRadialGradient(
                    this.x - 3, this.y - 3, 2,
                    this.x, this.y, this.radius
                );
                if (this.ultra) {
                    grad.addColorStop(0, '#fff7a0');
                    grad.addColorStop(0.5, '#f5d84a');
                    grad.addColorStop(1, '#d49a20');
                } else {
                    grad.addColorStop(0, '#a8f078');
                    grad.addColorStop(0.6, '#5cb83a');
                    grad.addColorStop(1, '#2d7a1a');
                }
                ctx.shadowColor = this.ultra ? 'rgba(255, 200, 50, 0.8)' : 'rgba(80, 200, 40, 0.5)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(this.x - 3, this.y - 4, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
            }
        }

        // ----- 阳光 -----
        class Sun {
            constructor(x, y, targetX, targetY, fromPlant = false) {
                this.x = x;
                this.y = y;
                this.targetX = targetX || x + rand(-40, 40);
                this.targetY = targetY || y + rand(40, 100);
                this.radius = 18;
                this.value = 25;
                this.collected = false;
                this.collecting = false;
                this.alpha = 1;
                this.fromPlant = fromPlant;
                this.life = 8000 + rand(0, 3000);
                this.timer = 0;
                this.animTimer = rand(0, 100);
                this.falling = !fromPlant;
                this.fallSpeed = 1.2 + rand(0, 0.8);
                this.fallTargetY = this.targetY;
                this.fallProgress = 0;
                this.bobOffset = rand(0, 100);
            }

            update(dt) {
                this.animTimer += dt;
                this.timer += dt;
                if (this.collecting) {
                    const dx = 60 - this.x;
                    const dy = 38 - this.y;
                    const d = Math.hypot(dx, dy);
                    if (d < 10) {
                        this.collected = true;
                        game.sun += this.value;
                        updateSunDisplay();
                    } else {
                        const speed = Math.max(8, d * 0.08);
                        this.x += (dx / d) * speed;
                        this.y += (dy / d) * speed;
                    }
                    return;
                }
                if (this.falling) {
                    this.fallProgress += this.fallSpeed * 0.06;
                    if (this.fallProgress >= 1) {
                        this.fallProgress = 1;
                        this.falling = false;
                        this.y = this.fallTargetY;
                    } else {
                        const t = this.fallProgress;
                        this.y = this.targetY - 80 + t * 80 + Math.sin(t * Math.PI * 2) * 4;
                        this.x = this.x + Math.sin(t * Math.PI * 3) * 0.15;
                    }
                } else {
                    this.y += Math.sin(this.animTimer * 0.002 + this.bobOffset) * 0.04;
                }
                if (this.timer > this.life && !this.collecting) {
                    this.alpha -= 0.008;
                    if (this.alpha <= 0) this.collected = true;
                }
            }

            draw(ctx) {
                if (this.collected) return;
                const r = this.radius * (0.9 + Math.sin(this.animTimer * 0.003) * 0.06);
                ctx.globalAlpha = this.alpha;
                const glow = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, r * 2.2);
                glow.addColorStop(0, 'rgba(255, 230, 80, 0.3)');
                glow.addColorStop(1, 'rgba(255, 230, 80, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r * 2.2, 0, Math.PI * 2);
                ctx.fill();

                const grad = ctx.createRadialGradient(
                    this.x - r * 0.3, this.y - r * 0.3, r * 0.1,
                    this.x, this.y, r
                );
                grad.addColorStop(0, '#fff7a0');
                grad.addColorStop(0.4, '#fadb3a');
                grad.addColorStop(0.8, '#e8a820');
                grad.addColorStop(1, '#b87a18');
                ctx.shadowColor = 'rgba(255, 200, 50, 0.6)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.shadowBlur = 0;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + this.animTimer * 0.001;
                    const len = r * 0.3 + Math.sin(this.animTimer * 0.005 + i) * 4;
                    const x1 = this.x + Math.cos(angle) * r * 0.85;
                    const y1 = this.y + Math.sin(angle) * r * 0.85;
                    const x2 = this.x + Math.cos(angle) * (r + len);
                    const y2 = this.y + Math.sin(angle) * (r + len);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = `rgba(255, 220, 80, ${0.5 + Math.sin(this.animTimer * 0.004 + i) * 0.2})`;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(this.x - r * 0.25, this.y - r * 0.3, r * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            collect() {
                if (this.collecting || this.collected) return;
                this.collecting = true;
            }
        }

        // ----- 能量豆 -----
        class EnergyBean {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.collected = false;
                this.collecting = false;
                this.alpha = 1;
                this.life = 10000;
                this.timer = 0;
                this.animTimer = rand(0, 100);
                this.falling = true;
                this.fallSpeed = 1.0;
                this.fallTargetY = y + rand(30, 70);
                this.fallProgress = 0;
                this.bobOffset = rand(0, 100);
                this.value = 1; // 能量豆计数
            }

            update(dt) {
                this.animTimer += dt;
                this.timer += dt;
                if (this.collecting) {
                    const dx = 60 - this.x;
                    const dy = 38 - this.y;
                    const d = Math.hypot(dx, dy);
                    if (d < 10) {
                        this.collected = true;
                        // 进入能量豆模式
                        game.ultraMode = true;
                        // 取消其他选择
                        game.selectedTool = null;
                        document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
                        updateSunDisplay();
                        // 提示文字
                        showMessage('💜 点击植物喂食能量豆！');
                    } else {
                        const speed = Math.max(8, d * 0.08);
                        this.x += (dx / d) * speed;
                        this.y += (dy / d) * speed;
                    }
                    return;
                }
                if (this.falling) {
                    this.fallProgress += this.fallSpeed * 0.05;
                    if (this.fallProgress >= 1) {
                        this.fallProgress = 1;
                        this.falling = false;
                        this.y = this.fallTargetY;
                    } else {
                        const t = this.fallProgress;
                        this.y = this.fallTargetY - 60 + t * 60 + Math.sin(t * Math.PI * 2) * 3;
                    }
                } else {
                    this.y += Math.sin(this.animTimer * 0.002 + this.bobOffset) * 0.05;
                }
                if (this.timer > this.life && !this.collecting) {
                    this.alpha -= 0.01;
                    if (this.alpha <= 0) this.collected = true;
                }
            }

            draw(ctx) {
                if (this.collected) return;
                const r = this.radius * (0.9 + Math.sin(this.animTimer * 0.004) * 0.08);
                ctx.globalAlpha = this.alpha;
                // 光晕
                const glow = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, r * 2.8);
                glow.addColorStop(0, 'rgba(180, 80, 255, 0.4)');
                glow.addColorStop(1, 'rgba(180, 80, 255, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r * 2.8, 0, Math.PI * 2);
                ctx.fill();

                // 主体
                const grad = ctx.createRadialGradient(
                    this.x - r * 0.3, this.y - r * 0.3, r * 0.1,
                    this.x, this.y, r
                );
                grad.addColorStop(0, '#e8b0ff');
                grad.addColorStop(0.4, '#b060f0');
                grad.addColorStop(0.8, '#7a30b0');
                grad.addColorStop(1, '#4a1080');
                ctx.shadowColor = 'rgba(180, 80, 255, 0.8)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // 闪烁星星
                ctx.shadowBlur = 0;
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + this.animTimer * 0.002;
                    const len = r * 0.6 + Math.sin(this.animTimer * 0.006 + i) * 6;
                    const sx = this.x + Math.cos(angle) * len;
                    const sy = this.y + Math.sin(angle) * len * 0.7;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 2.5 + Math.sin(this.animTimer * 0.005 + i) * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.6 + Math.sin(this.animTimer * 0.004 + i) * 0.3})`;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            collect() {
                if (this.collecting || this.collected) return;
                this.collecting = true;
            }
        }

        // ---------- UI 消息 ----------
        let messageText = '';
        let messageTimer = 0;

        function showMessage(text) {
            messageText = text;
            messageTimer = 2000;
        }

        // ---------- 更新显示 ----------
        function updateSunDisplay() {
            sunDisplay.textContent = Math.floor(game.sun);
            updateCardStates();
        }

        function updateCardStates() {
            const sun = game.sun;
            for (let key in cards) {
                const card = cards[key];
                if (key === 'shovel') continue;
                const cost = PLANT_CONFIG[key] ? PLANT_CONFIG[key].cost : 999;
                card.classList.toggle('disabled', sun < cost);
            }
        }

        // ---------- 种植逻辑 ----------
        function tryPlant(row, col) {
            if (game.gameOver) return false;
            const type = game.selectedTool;
            if (!type || type === 'shovel') return false;
            if (game.grid[row][col]) return false;
            const cfg = PLANT_CONFIG[type];
            if (!cfg) return false;
            if (game.sun < cfg.cost) return false;

            game.sun -= cfg.cost;
            updateSunDisplay();

            const plant = new Plant(row, col, type);
            game.plants.push(plant);
            game.grid[row][col] = plant;

            game.selectedTool = null;
            document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
            return true;
        }

        // ---------- 铲子逻辑 ----------
        function tryShovel(row, col) {
            if (game.gameOver) return false;
            const plant = game.grid[row][col];
            if (!plant) return false;
            const idx = game.plants.indexOf(plant);
            if (idx !== -1) {
                game.plants.splice(idx, 1);
                game.grid[row][col] = null;
                // 返还一半阳光？ 不返还，保持原版风格
                game.selectedTool = null;
                document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
                return true;
            }
            return false;
        }

        // ---------- 僵尸生成 ----------
        function spawnZombie() {
            if (game.gameOver) return;
            const row = randInt(0, CONFIG.ROWS - 1);
            const typeKey = weightedRandom(ZOMBIE_WEIGHTS);
            const zombie = new Zombie(row, typeKey);
            game.zombies.push(zombie);
        }

        function dropSunFromSky() {
            if (game.gameOver) return;
            const col = randInt(0, CONFIG.COLS - 1);
            const x = col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + rand(-20, 20);
            const y = -30 + rand(-20, 20);
            const targetY = rand(60, CONFIG.ROWS * CONFIG.CELL_SIZE - 40);
            const sun = new Sun(x, y, x + rand(-30, 30), targetY, false);
            game.suns.push(sun);
        }

        // ---------- 游戏初始化 ----------
        function initGame() {
            game.sun = CONFIG.INITIAL_SUN;
            game.selectedTool = null;
            game.plants = [];
            game.zombies = [];
            game.projectiles = [];
            game.suns = [];
            game.energyBeans = [];
            game.gameOver = false;
            game.score = 0;
            game.frame = 0;
            game.lastSunDrop = 0;
            game.lastZombieSpawn = 0;
            game.zombieSpawnInterval = 6000 + rand(0, 3000);
            game.ultraMode = false;
            initGrid();
            overlay.classList.remove('show');
            document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
            updateSunDisplay();
            messageText = '';
            for (let i = 0; i < 3; i++) {
                setTimeout(() => dropSunFromSky(), 500 + i * 800);
            }
        }

        // ---------- 更新 ----------
        function update(dt) {
            if (game.gameOver) return;
            game.frame++;

            for (const plant of game.plants) plant.update(dt);
            for (const proj of game.projectiles) proj.update();
            game.projectiles = game.projectiles.filter(p => p.active);
            for (const zombie of game.zombies) zombie.update(dt);
            game.zombies = game.zombies.filter(z => !z.dead || z.hp > 0);
            for (const sun of game.suns) sun.update(dt);
            game.suns = game.suns.filter(s => !s.collected);
            for (const bean of game.energyBeans) bean.update(dt);
            game.energyBeans = game.energyBeans.filter(b => !b.collected);

            // 超时取消能量豆模式
            if (game.ultraMode) {
                // 如果5秒没有喂食，自动取消
                if (!game._ultraTimer) game._ultraTimer = 0;
                game._ultraTimer += dt;
                if (game._ultraTimer > 5000) {
                    game.ultraMode = false;
                    game._ultraTimer = 0;
                    showMessage('⏳ 能量豆失效');
                }
            } else {
                game._ultraTimer = 0;
            }

            game.lastSunDrop += dt;
            if (game.lastSunDrop > CONFIG.SUN_INTERVAL) {
                game.lastSunDrop = 0;
                dropSunFromSky();
            }

            game.lastZombieSpawn += dt;
            if (game.lastZombieSpawn > game.zombieSpawnInterval) {
                game.lastZombieSpawn = 0;
                game.zombieSpawnInterval = CONFIG.ZOMBIE_SPAWN_MIN + rand(0, CONFIG.ZOMBIE_SPAWN_MAX - CONFIG
                .ZOMBIE_SPAWN_MIN);
                const count = Math.random() < 0.25 ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => spawnZombie(), i * 400);
                }
            }

            if (messageTimer > 0) {
                messageTimer -= dt;
                if (messageTimer < 0) messageTimer = 0;
            }

            if (game.gameOver) overlay.classList.add('show');
        }

        // ---------- 绘制 ----------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 网格
            for (let r = 0; r < CONFIG.ROWS; r++) {
                for (let c = 0; c < CONFIG.COLS; c++) {
                    const x = c * CONFIG.CELL_SIZE;
                    const y = r * CONFIG.CELL_SIZE + CONFIG.TOP_OFFSET;
                    const shade = (r + c) % 2 === 0 ? '#7cb85c' : '#6dab4e';
                    ctx.fillStyle = shade;
                    ctx.fillRect(x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                }
            }

            // 植物
            for (const plant of game.plants) plant.draw(ctx);
            // 子弹
            for (const proj of game.projectiles) proj.draw(ctx);
            // 僵尸
            for (const zombie of game.zombies) zombie.draw(ctx);
            // 阳光
            for (const sun of game.suns) sun.draw(ctx);
            // 能量豆
            for (const bean of game.energyBeans) bean.draw(ctx);

            // 高亮
            if (game.selectedTool && mouseRow >= 0 && mouseCol >= 0) {
                const x = mouseCol * CONFIG.CELL_SIZE;
                const y = mouseRow * CONFIG.CELL_SIZE + CONFIG.TOP_OFFSET;
                ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
                ctx.fillRect(x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                ctx.strokeStyle = 'rgba(255, 255, 100, 0.7)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.strokeRect(x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                ctx.setLineDash([]);
                if (game.selectedTool !== 'shovel') {
                    ctx.globalAlpha = 0.5;
                    const preview = new Plant(mouseRow, mouseCol, game.selectedTool);
                    preview.draw(ctx);
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = 'rgba(255,0,0,0.2)';
                    ctx.fillRect(x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                    ctx.font = '30px sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✖', x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
                }
            }

            // 信息
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, 26);
            ctx.fillStyle = '#f5e6c8';
            ctx.font = 'bold 13px "Segoe UI", sans-serif';
            ctx.fillText(`🧟 击杀: ${game.score}`, 12, 19);
            ctx.fillText(`🌱 植物: ${game.plants.length}`, 130, 19);
            const zombieCount = game.zombies.filter(z => !z.dead).length;
            ctx.fillText(`🧟 僵尸: ${zombieCount}`, 250, 19);
            if (game.ultraMode) {
                ctx.fillStyle = '#e8b0ff';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('💜 能量豆模式 (点击植物喂食)', 380, 19);
            }

            // 消息
            if (messageTimer > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(canvas.width / 2 - 120, canvas.height / 2 - 30, 240, 50);
                ctx.fillStyle = '#fff7c0';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(messageText, canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }

        // ---------- 循环 ----------
        let lastTime = 0;

        function gameLoop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 32);
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- 鼠标/触摸事件 ----------
        let mouseRow = -1,
            mouseCol = -1;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const px = (e.clientX - rect.left) * scaleX;
            const py = (e.clientY - rect.top) * scaleY;
            const result = pixelToCell(px, py);
            if (result.valid) { mouseRow = result.row;
                mouseCol = result.col; } else { mouseRow = -1;
                mouseCol = -1; }
        });
        canvas.addEventListener('mouseleave', () => { mouseRow = -1;
            mouseCol = -1; });

        canvas.addEventListener('click', (e) => {
            if (game.gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const px = (e.clientX - rect.left) * scaleX;
            const py = (e.clientY - rect.top) * scaleY;

            // 1. 点击能量豆
            for (const bean of game.energyBeans) {
                if (bean.collecting || bean.collected) continue;
                if (dist({ x: px, y: py }, { x: bean.x, y: bean.y }) < bean.radius + 15) {
                    bean.collect();
                    return;
                }
            }

            // 2. 点击阳光
            for (const sun of game.suns) {
                if (sun.collecting || sun.collected) continue;
                if (dist({ x: px, y: py }, { x: sun.x, y: sun.y }) < sun.radius + 12) {
                    sun.collect();
                    return;
                }
            }

            // 3. 网格交互
            const result = pixelToCell(px, py);
            if (!result.valid) return;

            // 如果处于能量豆模式
            if (game.ultraMode) {
                const plant = game.grid[result.row][result.col];
                if (plant) {
                    plant.activateUltra();
                    game.ultraMode = false;
                    game._ultraTimer = 0;
                    showMessage('✨ 大招激活！');
                    // 清除所有能量豆
                    game.energyBeans = [];
                    return;
                } else {
                    showMessage('❌ 请点击植物！');
                    return;
                }
            }

            // 铲子
            if (game.selectedTool === 'shovel') {
                tryShovel(result.row, result.col);
                return;
            }

            // 种植
            if (game.selectedTool) {
                tryPlant(result.row, result.col);
                mouseRow = -1;
                mouseCol = -1;
            }
        });

        // 触摸支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const px = (touch.clientX - rect.left) * scaleX;
            const py = (touch.clientY - rect.top) * scaleY;

            // 模拟点击
            const clickEvent = new MouseEvent('click', {
                clientX: touch.clientX,
                clientY: touch.clientY,
            });
            canvas.dispatchEvent(clickEvent);
        }, { passive: false });

        // ---------- 卡片点击 ----------
        function setupCards() {
            for (let key in cards) {
                const card = cards[key];
                card.addEventListener('click', () => {
                    if (game.gameOver) return;
                    // 如果处于能量豆模式，取消能量豆模式或忽略？
                    if (game.ultraMode) {
                        game.ultraMode = false;
                        game._ultraTimer = 0;
                        showMessage('能量豆模式取消');
                        document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
                        return;
                    }

                    const tool = card.dataset.plant;
                    if (tool === 'shovel') {
                        // 切换铲子
                        if (game.selectedTool === 'shovel') {
                            game.selectedTool = null;
                            card.classList.remove('selected');
                        } else {
                            game.selectedTool = 'shovel';
                            document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
                            card.classList.add('selected');
                        }
                        return;
                    }

                    const cost = PLANT_CONFIG[tool] ? PLANT_CONFIG[tool].cost : 999;
                    if (game.sun < cost) {
                        card.style.transform = 'scale(0.9)';
                        setTimeout(() => card.style.transform = '', 150);
                        return;
                    }
                    if (game.selectedTool === tool) {
                        game.selectedTool = null;
                        card.classList.remove('selected');
                    } else {
                        document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
                        game.selectedTool = tool;
                        card.classList.add('selected');
                        // 如果铲子选中，取消
                        if (cards.shovel.classList.contains('selected')) cards.shovel.classList.remove('selected');
                    }
                });
            }
        }

        // ---------- 重启 ----------
        restartBtn.addEventListener('click', () => {
            initGame();
            mouseRow = -1;
            mouseCol = -1;
            game.ultraMode = false;
            game._ultraTimer = 0;
            document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
        });

        // ---------- 键盘快捷键 ----------
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') cards.sunflower.click();
            else if (e.key === '2') cards.peashooter.click();
            else if (e.key === '3') cards.wallnut.click();
            else if (e.key === '4') cards.potato.click();
            else if (e.key === '5') cards.shovel.click();
            else if (e.key === 'Escape') {
                game.selectedTool = null;
                game.ultraMode = false;
                game._ultraTimer = 0;
                document.querySelectorAll('.plant-card').forEach(el => el.classList.remove('selected'));
            } else if (e.key === 'r' || e.key === 'R') restartBtn.click();
        });

        // ---------- 自适应缩放 ----------
        function adjustScale() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('game-wrapper');
            const w = window.innerWidth;
            const h = window.innerHeight;
            // 容器自然大小 (宽高 + padding)
            const naturalW = 760;
            const naturalH = 520;
            const scaleX = (w - 20) / naturalW;
            const scaleY = (h - 20) / naturalH;
            let scale = Math.min(scaleX, scaleY, 1.6);
            scale = Math.max(scale, 0.4);
            container.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustScale);
        window.addEventListener('load', () => {
            adjustScale();
            initGame();
            setupCards();
            updateSunDisplay();
            setInterval(updateSunDisplay, 200);
            requestAnimationFrame((ts) => {
                lastTime = ts;
                gameLoop(ts);
            });
        });

        console.log('🌻 植物大战僵尸 · 增强版');
        console.log('快捷键: [1]向日葵 [2]射手 [3]坚果墙 [4]土豆雷 [5]铲子 [Esc]取消 [R]重启');
        console.log('💜 能量豆：击杀僵尸有概率掉落，点击拾取后点击植物释放大招！');
    </script>
</body>
